name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-dev.txt
      - run: pip install -r inference/requirements-dev.txt
      - name: Python tests (physics, cleaning, events, forecast, indicators, end to end on simulated data)
        run: python -m pytest inference/tests -q
      - name: Dashboard script parses
        run: node --check web/app.js
