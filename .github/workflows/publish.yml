# Every ~30 minutes: pull the readings from Supabase, run the inference, publish dashboard + JSON to GitHub Pages.
# The Supabase *secret* key lives only in Actions secrets; the published site contains no keys and makes no database calls.
name: Publish dashboard

on:
  schedule:
    - cron: "7,37 * * * *"        # off the hour on purpose: top-of-hour runs are the most likely to be delayed or dropped
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "inference/**", "config/**", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements-dev.txt

      - run: pip install -r inference/requirements-dev.txt

      - name: Tests (never publish from broken code)
        run: python -m pytest inference/tests -q

      - name: Build the site and the data snapshot
        env:
          PYTHONPATH: inference
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          rm -rf _site && mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/data/sample
          # a failed fetch exits non-zero: the job fails and the previous good site stays online
          python -m soilmon.run --source supabase --config-dir config --out _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
