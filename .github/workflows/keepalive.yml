# GitHub switches scheduled workflows off in public repos after 60 days without repository activity.
# Once a month, if the last commit is older than 45 days, add an empty commit so the schedule in publish.yml keeps running.
# (If the schedule ever shows as disabled anyway: Actions tab -> "Publish dashboard" -> Enable workflow.)
name: Keep schedule alive

on:
  schedule:
    - cron: "23 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit when the repo has been quiet
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit is ${age_days} days old"
          if [ "$age_days" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows enabled"
            git push
          fi
